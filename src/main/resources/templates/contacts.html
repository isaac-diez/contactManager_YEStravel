<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Home')}"></head>
<body>
<div class="container">

    <!--    Navbar menu -->
<div th:replace="~{fragments/navbar::navbar-section}"></div>

    <!--  Div for table  -->
    <div class="container text-center" style="margin: 30px">
        <h3>YEStravel Contact Manager</h3>
    </div>

    <div class="container">

        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark text-center">
            <tr>
                <th scope="col">#</th>
                <th scope="col">First</th>
                <th scope="col">Last</th>
                <th scope="col">姓</th>
                <th scope="col">名字</th>
                <th scope="col">Phone</th>
                <th scope="col">Email</th>
                <th scope="col">Birthday</th>
            </tr>
            </thead>
            <tbody class="text-center">
            <tr th:each="contact : ${contactPage}"
                th:onclick="|window.location.href='@{/contacts/view/{id}(id=${contact.id})}'|"
                style="cursor: pointer">
                <th th:text="${contact.id}" scope="row"></th>
                <td th:text="${contact.firstNameEng}"></td>
                <td th:text="${contact.familyNameEng}"></td>
                <td th:text="${contact.firstNameCh}"></td>
                <td th:text="${contact.familyNameCh}"></td>
                <td th:text="${contact.mobilePhone}"></td>
                <td th:text="${contact.email}"></td>
                <td th:text="${#temporals.format(contact.birthDate, 'dd-MM-yyyy')}"></td>
<!--                <td>-->
<!--                    <div class="container">-->
<!--                        <a th:href="@{/contacts/edit/{id}(id=${contact.id})}"-->
<!--                           class="btn btn-warning btn-sm me-3">Edit</a>-->
<!--                        <a th:href="@{/contacts/delete/{id}(id=${contact.id)}"-->
<!--                           class="btn btn-danger btn-sm me-3">Delete</a>-->
<!--                    </div>-->
<!--                </td>-->
            </tr>
            </tbody>
        </table>
        <div th:with="basePath='/contacts'">
            <div th:replace="~{fragments/pagination :: pagination-section(${contactPage}, '/contacts')}"></div>
            </div>
    </div>
    <div th:replace="~{fragments/footer::footer-section}"></div>
</div>

<div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Contacts CSV</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="importForm">
                    <div class="mb-3">
                        <input class="form-control" type="file" id="csvFile" accept=".csv" required>
                    </div>
                    <div id="importMessage" class="mt-2 small"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="btnDoImport" class="btn btn-primary">Import</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/import-contacts.js"></script>

</body>
</html>
