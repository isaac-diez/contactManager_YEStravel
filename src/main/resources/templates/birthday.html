<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Upcoming Birthdays')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar::navbar-section}"></div>

<div class="container-md px-0 px-md-3">

    <div class="row mb-4 pt-5 mx-0 px-3 px-md-0">
        <div class="col-12 text-center">
            <h1 class="display-5 fw-bold text-primary">
                <i class="bi bi-cake2"></i> Upcoming Birthdays
            </h1>
            <p class="text-muted">Manage your contacts' special days and send greetings.</p>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-nowrap">
            <thead class="table-dark text-center">
            <tr>
                <th scope="col">First</th>
                <th scope="col">Last</th>
                <th scope="col">姓</th>
                <th scope="col">名字</th>
                <th scope="col">Phone</th>
                <th scope="col">Email</th>
                <th scope="col">Birthday</th>
            </tr>
            </thead>
            <tbody class="text-center">
            <tr th:each="contact : ${contactPage}"
                th:onclick="|window.location.href='@{/contacts/view/{id}(id=${contact.id})}'|"
                style="cursor: pointer">
                <td class="fw-semibold" th:text="${contact.firstNameEng}"></td>
                <td class="fw-semibold" th:text="${contact.familyNameEng}"></td>
                <td th:text="${contact.firstNameCh}"></td>
                <td th:text="${contact.familyNameCh}"></td>
                <td th:text="${contact.mobilePhone}"></td>
                <td th:text="${contact.email}"></td>
                <td>
                        <span class="badge rounded-pill bg-info text-dark">
                        <i class="bi bi-cake2"></i>
                        <span th:text="${#temporals.format(contact.birthDate, 'dd MMM')}"></span>
                        </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="px-3 px-md-0 mt-4" th:with="basePath='/birthday'">
        <div th:replace="~{fragments/pagination :: pagination-section(${contactPage}, '/contacts/birthday')}"></div>
    </div>

</div>

<div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Contacts CSV</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="importForm">
                    <div class="mb-3">
                        <input class="form-control" type="file" id="csvFile" accept=".csv" required>
                    </div>
                    <div id="importMessage" class="mt-2 small"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="btnDoImport" class="btn btn-primary">Import</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer::footer-section}"></div>

</body>
</html>
