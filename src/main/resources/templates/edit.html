<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/header::header-section(title='Edit Contact')}"></head>
    <body class="bg-light">

        <div th:replace="~{fragments/navbar::navbar-section}"></div>

        <div class="container-md px-0 px-md-3">
            <div class="row mb-4 pt-5 mx-0 px-3 px-md-0">
                <div class="col-12 text-center">
                    <h1 class="display-5 fw-bold text-primary">
                        <i class="bi bi-person-gear"></i> Edit contact
                    </h1>
                </div>
            </div>

            <form class="px-3 px-md-0" action="/contacts/edit" th:object="${contactToEdit}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="row g-4">
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <select class="form-select" id="title" name="title"
                                    th:field="*{title}" aria-describedby="titleDiv">>
                                <option value="null"></option>
                                <option value="Mr.">Mr.</option>
                                <option value="Ms.">Ms.</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                            <label for="title" class="form-label">Title</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="firstNameCh" name="firstNameCh" required="true"
                                   th:field="*{firstNameCh}" aria-describedby="firstNameChDiv">
                            <label for="firstNameCh" class="form-label">姓名</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="firstNameEng" name="firstNameEng" required="true"
                                   th:field="*{firstNameEng}" aria-describedby="firstNameEngDiv">
                            <label for="firstNameEng" class="form-label">Name</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="familyNameEng" name="familyNameEng" required="true"
                                   th:field="*{familyNameEng}" aria-describedby="familyNameEngDiv">
                            <label for="familyNameEng" class="form-label">Family Name</label>
                        </div>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-md">
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control" id="company" name="company"
                                   th:field="*{company}" aria-describedby="companyDiv">
                            <label for="company" class="form-label">Company</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control" id="position" name="position"
                                   th:field="*{position}" aria-describedby="positionDiv">
                            <label for="position" class="form-label">Position</label>
                        </div>
                    </div>
                </div>
                <div class="row g-4">
                    <div class="col-md">
                        <div class="form-floating mb-4">
                            <input type="tel" class="form-control" id="mobilePhone" name="mobilePhone" required="true"
                                   th:field="*{mobilePhone}" aria-describedby="mobilePhoneDiv">
                            <label for="mobilePhone" class="form-label">Mobile Phone</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-4">
                            <input type="email" class="form-control" id="email" name="email" required="true"
                                   th:field="*{email}" aria-describedby="emailDiv">
                            <label for="email" class="form-label">Email address</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-4">
                            <input type="date" class="form-control" id="birthDate" name="birthDate"
                                   th:field="*{birthDate}" aria-describedby="birthDateDiv">
                            <label for="birthDate" class="form-label">Birthdate</label>
                        </div>
                    </div>
                    <div sec:authorize="hasRole('ADMIN')" class="col-md">
                        <div class="form-floating mb-4">
                            <select class="form-select" th:field="*{userId}" id="ownerSelect">
                                <option value="" disabled selected>Select user...</option>
                                <option th:each="u : *{potentialOwners}"
                                        th:value="${u.id}"
                                        th:text="${u.username}">
                                </option>
                            </select>
                            <label for="ownerSelect" class="form-label">Owner</label>
                        </div>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{birthdayReminder}" id="remindCheck">
                        <label class="form-check-label" for="remindCheck">Birthday reminder</label>
                    </div>
                </div>

                <div class="mb-3">
                    <p>Current owner: <strong th:text="*{userName}">Nombre</strong></p>
                </div>

                <div class="text-center mt-5">
                    <button type="submit" class="btn btn-warning me-3">Update contact</button>
                    <a th:href="@{/contacts/view/{id}(id=*{id})}" class="btn btn-danger">Go back</a>
                </div>

            </form>
        </div>

        <div th:replace="~{fragments/footer::footer-section}"></div>

    </body>
</html>
