<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Register')}">
</head>
<body class="body_auth">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="auth-container text-center">
        <img src="/img/yes_logo.png" alt="Company Logo" class="logo-img img-fluid mb-4">

        <h2 class="mb-4">Register</h2>

        <form id="registerForm" class="mb-3">
            <div class="mb-3">
                <label for="username" class="form-label visually-hidden">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" required/>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label visually-hidden">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email" required/>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label visually-hidden">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required/>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label visually-hidden">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm Password" required/>
            </div>
            <input type="hidden" id="role" name="role" value="ROLE_USER"/>

            <button type="submit" class="btn btn-success w-100 mb-2">Register</button>
        </form>

        <p id="message" class="mt-3" style="color:red;"></p>
    </div>
</div>

<div th:replace="~{fragments/footer::footer-section}"></div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            document.getElementById('message').style.color = 'red';
            document.getElementById('message').textContent = 'Passwords do not match!';
            return;
        }

        const data = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: password,
            role: document.getElementById('role').value
        };

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById('message').style.color = 'green';
                document.getElementById('message').textContent = 'Registration successful! Redirecting to home...';
                setTimeout(() => {
                    window.location.href = "/contacts";
                }, 2000);
            } else {
                const result = await response.json().catch(() => ({ message: 'Registration failed' }));
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').textContent = result.message || 'Registration failed';
            }
        } catch (err) {
            document.getElementById('message').style.color = 'red';
            document.getElementById('message').textContent = 'An error occurred during registration.';
        }
    });
</script>
</body>
</html>
