<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<h2>Register</h2>

<form id="registerForm">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required/><br/><br/>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required/><br/><br/>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required/><br/><br/>

    <label for="role">Role:</label>
    <select id="role" name="role">
        <option value="USER">USER</option>
        <option value="ADMIN">ADMIN</option>
    </select><br/><br/>

    <button type="submit">Register</button>
</form>

<p id="message" style="color:red;"></p>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                document.getElementById('message').style.color = 'green';
                document.getElementById('message').textContent = 'Registered successfully!';
            } else {
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').textContent = result.message || 'Registration failed';
            }
        } catch (err) {
            document.getElementById('message').textContent = 'Server error';
            console.error(err);
        }
    });
</script>
</body>
</html>
