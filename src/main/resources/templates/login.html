<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Login')}"></head>

<body class="body_auth">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="auth-container text-center">
        <img src="/img/yes_logo.png" alt="Company Logo" class="logo-img img-fluid mb-4">

        <h2 class="mb-4">Login</h2>

        <form id="loginForm" class="mb-3">
            <div class="mb-3">
                <label for="username" class="form-label visually-hidden">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" required/>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label visually-hidden">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
        </form>

        <p class="mb-0">¿No tienes cuenta?
            <a href="/register" class="btn btn-outline-secondary btn-sm">Regístrate</a>
        </p>

        <p id="message" class="mt-3" style="color:red;"></p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById('message').style.color = 'green';
                document.getElementById('message').textContent = 'Login successful!';
                window.location.href = "/contacts/";
            } else {
                const result = await response.json().catch(() => ({ message: 'Login failed' }));
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').textContent = result.message || 'Login failed';
            }
        } catch (err) {
            document.getElementById('message').style.color = 'red';
            document.getElementById('message').textContent = 'An error occurred during login.';
        }
    });
</script>
</body>
</html>
