<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="pagination-section (pageObj, basePath)" th:remove="tag">

        <ul class="pagination" th:if="${pageObj.totalPages > 1}">

            <!-- First -->
            <li class="page-item" th:if="${pageObj.number > 0}">
                <a class="page-link"
                   th:href="@{${basePath}(search=${param.search}, page=0,size=${pageObj.size})}"
                   aria-label="First"><span aria-hidden="true">« First</span></a>
            </li>

            <!-- Previous -->
            <li class="page-item" th:if="${pageObj.hasPrevious()}">
                <a class="page-link"
                   th:href="@{${basePath}(search=${param.search}, page=${pageObj.number - 1}, size=${pageObj.size})}"
                   aria-label="Previous"><span aria-hidden="true">&lsaquo; Prev</span></a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(
                    T(java.lang.Math).max(0, pageObj.number - 2),
                    T(java.lang.Math).min(pageObj.totalPages - 1, pageObj.number + 2))}"
                th:classappend="${i == pageObj.number} ? 'active'">

                <a class="page-link"
                   th:if="${i != pageObj.number}"
                   th:href="@{${basePath}(search=${param.search}, page=${i}, size=${pageObj.size})}"
                   th:text="${i + 1}">1</a>

                <span class="page-link"
                      th:if="${i == pageObj.number}"
                      th:text="${i + 1}"></span>
            </li>

            <li class="page-item" th:if="${pageObj.hasNext()}">
                <a class="page-link"
                   th:href="@{${basePath}(search=${param.search}, page=${pageObj.number + 1}, size=${pageObj.size})}"
                   aria-label="Next"><span aria-hidden="true">Next &rsaquo;</span></a>
            </li>

            <li class="page-item" th:if="${!pageObj.last}">
                <a class="page-link"
                   th:href="@{${basePath}(search=${param.search}, page=${pageObj.totalPages - 1}, size=${pageObj.size})}"
                   aria-label="Last"><span aria-hidden="true">Last &raquo;</span></a>
            </li>
        </ul>
    </div>
</html>
