<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header-section(title)">
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
          crossorigin="anonymous">
    <style>
        body_auth {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 30px; /* Más padding para que se vea mejor */
            background-color: #fff; /* Fondo BLANCO para que contraste con el body */
            border-radius: 10px; /* Esquinas redondeadas */
            /* Sombra más notable para que el contenedor 'flote' */
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
        }
        .logo-img {
            max-width: 120px;
            margin-bottom: 25px;
        }
    </style>
</head>
</html>
