<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Contact: ' + ${contact.firstNameEng} + ' ' + ${contact.familyNameEng})}"></head>

<body>
    <div class="container">

        <!--    Navbar menu -->
        <div th:replace="~{fragments/navbar::navbar-section}"></div>

        <!--  Div para desplegar tabla  -->
        <div class="container text-center" style="margin: 30px">
            <h3 class="text-2xl font-bold mb-4 text-center" th:text="${contact.firstNameEng} + ' ' + ${contact.familyNameEng}">Contact Name</h3>
        </div>

        <div class="container">
            <form>
                <div class="row g-2">
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <input type="text" id="firstNameEng"
                                   class="form-control"
                                   th:value="${contact.firstNameEng}" disabled>
                            <label for="firstNameEng" class="form-label">Name</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <input type="text" id="familyNameEng"
                                   class="form-control"
                                   th:value="${contact.familyNameEng}" disabled>
                            <label for="familyNameEng" class="form-label">Family Name</label>
                        </div>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <input type="text" id="firstNameCh"
                                   class="form-control"
                                   th:value="${contact.firstNameCh}" disabled>
                            <label for="firstNameCh" class="form-label">姓</label>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating mb-3">
                            <input type="text" id="familyNameCh"
                                   class="form-control"
                                   th:value="${contact.familyNameCh}" disabled>
                            <label for="familyNameCh" class="form-label">名字</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" id="mobilePhone"
                           class="form-control"
                           th:value="${contact.mobilePhone}" disabled>
                    <label for="mobilePhone" class="form-label">Mobile Phone</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" id="email"
                           class="form-control"
                           th:value="${contact.email}" disabled>
                    <label for="email" class="form-label">Email address</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" id="birthDate"
                           class="form-control"
                           th:value="${contact.birthDate}" disabled>
                    <label for="birthDate" class="form-label">Birthdate</label>
                </div>


            </form>
        </div>

        <div class="container text-center">
            <a th:href="@{/contacts/edit/{id}(id=${contact.id})}"
               class="btn btn-warning btn-sm me-3">Edit</a>
            <a th:href="@{/contacts/delete/{id}(id=${contact.id})}"
               class="btn btn-danger btn-sm me-3">Delete</a>
        </div>

        <div class="container mt-5">

            <h2 class="text-xl font-semibold mb-2">Interactions</h2>

                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark text-center">
                <tr>
                    <th scope="col">Id.</th>
                    <th scope="col">Type</th>
                    <th scope="col">Date</th>
                    <th scope="col">Description</th>
                    <th scope="col">User</th>
                </tr>
                </thead>
                <tbody class="text-center">
                <tr th:each="interaction : ${interactions}">
                    <th th:text="${interaction.id}" scope="row"></th>
                    <td th:text="${interaction.type}"></td>
                    <td th:text="${#temporals.format(interaction.date, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${interaction.description}"></td>
                    <td th:text="${interaction.user.username}"></td>
                </tr>
                </tbody>
            </table>
                <div th:with="basePath='/interactions'">
                    <div th:replace="fragments/pagination :: pagination-section(${interactionPage}, '/contacts/view/' + ${contact.id})"></div>
                </div>

            <div class="text-end mb-3">
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newInteractionModal">
                    New Interaction
                </button>
            </div>

            <!-- Modal -->
            <div class="modal fade" id="newInteractionModal" tabindex="-1" aria-labelledby="newInteractionModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="newInteractionModalLabel">Add New Interaction</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="newInteractionForm">
                                <div class="mb-3">
                                    <label for="type" class="form-label">Type</label>
                                    <select class="form-select" id="type" required>
                                        <option th:each="t : ${interactionTypes}"
                                                th:value="${t}"
                                                th:text="${t}"></option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" required></textarea>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-success" id="createInteractionBtn">Create</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center">
            <a href="/contacts" class="btn btn-secondary">Go back</a>
        </div>

        <script th:inline="javascript">
            const contactId = /*[[${contact.id}]]*/ 0;
            const username = /*[[${username}]]*/ 0; // adjust depending on how you expose user info

            document.getElementById("createInteractionBtn").addEventListener("click", async () => {
                const type = document.getElementById("type").value;
                const description = document.getElementById("description").value;

                const newInteraction = { contactId, username, type, description };

                const response = await fetch("/interactions/add", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newInteraction)
                });

                if (response.ok) {
                    const interaction = await response.json();

                    const dateObj = new Date(interaction.date);

                    const pad = n => n.toString().padStart(2, '0');
                    const formattedDate = `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())} ${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;

                    const tbody = document.querySelector("tbody");
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <th>${interaction.id}</th>
                        <td>${interaction.type}</td>
                        <td>${formattedDate}</td>
                        <td>${interaction.description}</td>
                        <td>${username}</td>
                    `;
                    tbody.appendChild(row);


                    document.getElementById("newInteractionForm").reset();
                    const modal = bootstrap.Modal.getInstance(document.getElementById("newInteractionModal"));
                    modal.hide();
                } else {
                    alert("Error creating interaction");
                }
            });
        </script>



        <div th:replace="~{fragments/footer::footer-section}"></div>

        </div>
    </div>
</body>
</html>
