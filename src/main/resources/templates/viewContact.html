<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header::header-section(title='Contact: ' + ${contact.firstNameEng} + ' ' + ${contact.familyNameEng})}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar::navbar-section}"></div>

<div class="container-md px-0 px-md-3">

    <div class="row mb-4 pt-5 mx-0 px-3 px-md-0">
        <div class="col-12 text-center">
            <h3 class="display-5 fw-bold text-primary text-center">
                <i class="bi bi-person-check"></i>
                <span th:text="${contact.firstNameEng} + ' ' + ${contact.familyNameEng} + ' ' + ${contact.firstNameCh}">Contact Name</span>
            </h3>
        </div>
    </div>

    <form class="px-3 px-md-0">
        <div class="row g-4">
            <div class="col-md">
                <div class="form-floating mb-3">
                    <input type="text" id="title"
                           class="form-control"
                           th:value="${contact.title}" disabled>
                    <label for="firstNameEng" class="form-label">Title</label>
                </div>
            </div>
            <div class="col-md">
                <div class="form-floating mb-3">
                    <input type="text" id="firstNameCh"
                           class="form-control"
                           th:value="${contact.firstNameCh}" disabled>
                    <label for="firstNameCh" class="form-label">姓名</label>
                </div>
            </div>
            <div class="col-md">
                <div class="form-floating mb-3">
                    <input type="text" id="firstNameEng"
                           class="form-control"
                           th:value="${contact.firstNameEng}" disabled>
                    <label for="firstNameEng" class="form-label">Name</label>
                </div>
            </div>
            <div class="col-md">
                <div class="form-floating mb-3">
                    <input type="text" id="familyNameEng"
                           class="form-control"
                           th:value="${contact.familyNameEng}" disabled>
                    <label for="familyNameEng" class="form-label">Family Name</label>
                </div>
            </div>
        </div>

        <div class="row g-2">
            <div class="col-md">
                <div class="form-floating mb-3">
                    <input type="text" id="complany"
                           class="form-control"
                           th:value="${contact.company}" disabled>
                    <label for="familyNameEng" class="form-label">Company</label>
                </div>
            </div>
            <div class="col-md">
                <div class="form-floating mb-3">
                    <input type="text" id="position"
                           class="form-control"
                           th:value="${contact.position}" disabled>
                    <label for="familyNameEng" class="form-label">Position</label>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md">
                <div class="form-floating mb-4">
                    <input type="text" id="mobilePhone"
                           class="form-control"
                           th:value="${contact.mobilePhone}" disabled>
                    <label for="mobilePhone" class="form-label">Mobile Phone</label>
                </div>
            </div>

            <div class="col-md">
                <div class="form-floating mb-4">
                    <input type="text" id="email"
                           class="form-control"
                           th:value="${contact.email}" disabled>
                    <label for="email" class="form-label">Email address</label>
                </div>
            </div>

            <div class="col-md">
                <div class="form-floating mb-4">
                    <input type="text" id="birthDate"
                           class="form-control"
                           th:value="${#temporals.format(contact.birthDate, 'dd/MM/yyyy')}" disabled>
                    <label for="birthDate" class="form-label">Birthdate</label>
                </div>
            </div>
            <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="col-md">
                <div class="form-floating mb-4">
                    <input type="text" id="user"
                            class="form-control"
                            th:value="${contact.user.username}" disabled>
                    <label for="user" class="form-label">Owner</label>
                </div>
            </div>
        </div>
        <div class="row g-1">
            <div class="col-md">
                <div class="form-group mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" th:checked="${contact.birthdayReminder}" id="remindCheck" disabled>
                        <label class="form-check-label" for="remindCheck">Birthday Reminder</label>
                    </div>
                </div>
            </div>
        </div>

    </form>


    <div class="text-center mt-5">
        <a th:href="@{/contacts/edit/{id}(id=${contact.id})}"
           class="btn btn-warning me-3">Edit</a>
        <a th:href="@{/contacts/delete/{id}(id=${contact.id})}"
           class="btn btn-danger me-3">Delete</a>
    </div>

    <div class="px-3 px-md-0 mt-5">

        <h2 class="text-xl font-semibold mb-2">Interactions</h2>

        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark text-center">
            <tr>
                <th scope="col">Type</th>
                <th scope="col">Date</th>
                <th scope="col">Description</th>
                <th scope="col">User</th>
            </tr>
            </thead>
            <tbody class="text-center">
            <tr th:each="interaction : ${interactions}">
                <td th:text="${interaction.type}"></td>
                <td th:text="${#temporals.format(interaction.date, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${interaction.description}"></td>
                <td th:text="${interaction.user.username}"></td>
            </tr>
            </tbody>
        </table>

        <div th:if="${interactionPage.totalElements > 0}" th:with="basePath='/interactions'">
            <div th:replace="~{fragments/pagination :: pagination-section(${interactionPage}, '/contacts/view/' + ${contact.id})}"></div>
        </div>
        <div th:if="${interactionPage.totalElements == 0}" class="text-center text-muted my-3">
            <p>No interactions recorded yet.</p>
        </div>

        <div class="text-end mb-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newInteractionModal">
                New Interaction
            </button>
        </div>

        <!-- Interaction Modal -->
        <div class="modal fade" id="newInteractionModal" tabindex="-1" aria-labelledby="newInteractionModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="newInteractionModalLabel">Add New Interaction</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="newInteractionForm">
                            <div class="mb-3">
                                <label for="type" class="form-label">Type</label>
                                <select class="form-select" id="type" required>
                                    <option th:each="t : ${interactionTypes}"
                                            th:value="${t}"
                                            th:text="${t}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" required></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-success" id="createInteractionBtn">Create</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center">
        <a href="/contacts" class="btn btn-secondary">Go back</a>
    </div>

</div>

</div>

<div th:replace="~{fragments/footer::footer-section}"></div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const contactId = [[${contact.id}]];
        const username = [[${#authentication.name}]];

        const createBtn = document.getElementById("createInteractionBtn");
        const modalElement = document.getElementById("newInteractionModal");

        const bModal = new bootstrap.Modal(modalElement);

        createBtn.addEventListener("click", async () => {
            const type = document.getElementById("type").value;
            const description = document.getElementById("description").value;

            if(!description) {
                alert("Please enter a description");
                return;
            }

            const newInteraction = { contactId, username, type, description };

            try {
                const response = await fetch("/interactions/add", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newInteraction)
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert("Error creating interaction");
                }
            } catch (error) {
                console.error("Fetch error:", error);
            }
        });
    });
</script>

</body>
</html>
